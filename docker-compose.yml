services:
  # database service
  postgresdb:
    image: postgres:16-alpine

  mysqldb:
    image: mysql:8.0.29

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1

networks:
  default:
    driver: bridge
    name: tedu-microservices

volumes:
  postgresdb_data:
    name: postgresdb_data
  mysqldb_data:
    name: mysqldb_data