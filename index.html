<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Large File Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./LargeFileUploader.js"></script> <!-- Link file JS ở trên -->
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-2xl">
        <div class="border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Upload File Lớn (Resumable)</h1>
            <p class="text-sm text-slate-500">Hỗ trợ file 50GB-100GB, tự động nối lại khi mất mạng.</p>
        </div>

        <!-- Input Area -->
        <div class="mb-6">
            <label class="block w-full p-10 border-2 border-dashed border-blue-300 rounded-lg text-center cursor-pointer hover:bg-blue-50 transition" id="dropZone">
                <input type="file" id="fileInput" class="hidden">
                <div class="text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <span class="font-semibold">Chọn file</span> hoặc kéo thả vào đây
                </div>
                <p class="mt-2 text-xs text-slate-400" id="fileName">Chưa chọn file</p>
            </label>
        </div>

        <!-- Progress Area -->
        <div id="progressContainer" class="hidden space-y-4">
            <div class="flex justify-between text-sm font-medium text-slate-700">
                <span id="statusText">Đang khởi tạo...</span>
                <span id="percentText">0%</span>
            </div>
            
            <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>

            <div class="flex justify-between text-xs text-slate-500 font-mono">
                <span id="chunksInfo">Chunks: 0/0</span>
                <span id="speedInfo">-- MB/s</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="mt-8 flex gap-3">
            <button id="btnUpload" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium disabled:opacity-50">
                Bắt đầu Upload
            </button>
            <button id="btnPause" class="px-6 py-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 font-medium hidden">
                Tạm dừng
            </button>
        </div>

        <!-- Success Message -->
        <div id="resultArea" class="mt-6 hidden p-4 bg-green-50 text-green-700 rounded-lg border border-green-200 text-sm break-all">
            ✅ Upload thành công! <br>
            URL: <a href="#" id="fileUrl" class="underline font-bold">...</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const btnUpload = document.getElementById('btnUpload');
        const progressBar = document.getElementById('progressBar');
        
        let uploader = null;
        let startTime = 0;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) document.getElementById('fileName').innerText = `${file.name} (${(file.size/1024/1024/1024).toFixed(2)} GB)`;
        });

        btnUpload.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return alert("Vui lòng chọn file!");

            document.getElementById('progressContainer').classList.remove('hidden');
            btnUpload.disabled = true;
            startTime = Date.now();

            // Khởi tạo Uploader
            uploader = new LargeFileUploader(file, {
                apiBaseUrl: 'http://localhost:5042/api/v1/uploads', // Đổi port theo Backend C#
                chunkSize: 5 * 1024 * 1024, // 5MB để demo cho mượt (Azure hỗ trợ tới 100MB)
                concurrency: 6, // 6 request cùng lúc
                
                onProgress: (percent, uploadedChunks, totalChunks) => {
                    // Update UI
                    progressBar.style.width = `${percent}%`;
                    document.getElementById('percentText').innerText = `${percent}%`;
                    document.getElementById('statusText').innerText = 'Đang upload...';
                    document.getElementById('chunksInfo').innerText = `Chunks: ${uploadedChunks}/${totalChunks}`;

                    // Tính tốc độ (Demo đơn giản)
                    const elapsed = (Date.now() - startTime) / 1000;
                    const speed = (uploadedChunks * 5) / elapsed; // MB/s (giả sử chunk 5MB)
                    document.getElementById('speedInfo').innerText = `${speed.toFixed(1)} MB/s`;
                },

                onComplete: (result) => {
                    document.getElementById('statusText').innerText = 'Hoàn tất!';
                    document.getElementById('progressBar').classList.add('bg-green-500');
                    document.getElementById('resultArea').classList.remove('hidden');
                    document.getElementById('fileUrl').innerText = result.fileUrl;
                    document.getElementById('fileUrl').href = result.fileUrl;
                    btnUpload.disabled = false;
                    btnUpload.innerText = "Upload file khác";
                },

                onError: (err) => {
                    console.error(err);
                    document.getElementById('statusText').innerText = `Lỗi: ${err.message}`;
                    document.getElementById('progressBar').classList.add('bg-red-500');
                    btnUpload.disabled = false;
                    alert("Có lỗi xảy ra, vui lòng mở Console xem chi tiết.");
                }
            });

            uploader.start();
        });
    </script>
</body>
</html>
